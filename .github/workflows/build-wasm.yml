name: Compilar Fafnir a WASM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 'latest'

      - name: Neutralizar incbin.h y compilar
        run: |
          mkdir -p dist

          # 1. Neutralizamos incbin.h sin romper la sangría YAML
          #    (en WASM la red se carga desde el FS virtual, no embebida)
          INCBIN_PATH=$(find third_party/stockfish -type f -name "incbin.h" | head -n 1)
          if [ -n "$INCBIN_PATH" ]; then
            echo "Neutralizando $INCBIN_PATH para WebAssembly..."
            echo '#ifndef INCBIN_HDR' > "$INCBIN_PATH"
            echo '#define INCBIN_HDR' >> "$INCBIN_PATH"
            echo '#define INCBIN(NAME, FILENAME) extern "C" { const unsigned char g##NAME##Data[1] = {0}; const unsigned char* const g##NAME##End = g##NAME##Data; const unsigned int g##NAME##Size = 0; }' >> "$INCBIN_PATH"
            echo '#define INCBIN_EXTERN(NAME) extern "C" { extern const unsigned char g##NAME##Data[]; extern const unsigned char* const g##NAME##End; extern const unsigned int g##NAME##Size; }' >> "$INCBIN_PATH"
            echo '#endif' >> "$INCBIN_PATH"
          fi

          # 2. Búsqueda de fuentes C++
          SRC_ENGINE=$(find src/ui src/engine src/bridges -type f -name "*.cpp")
          SRC_PROBE=$(find third_party/stockfish -type f -name "*.cpp" \
            ! -path "*/universal/*")

          NNUE_FILE=$(find assets/nnue -type f -name "*.nnue" | head -n 1)

          echo "Archivo NNUE detectado: $NNUE_FILE"
          echo "Compilando Fafnir para WASM..."

          em++ $SRC_ENGINE $SRC_PROBE \
            -std=c++17 \
            -O3 \
            -msimd128 \
            -flto \
            -funroll-loops \
            -finline-functions \
            -fomit-frame-pointer \
            -DNDEBUG \
            -DNNUE_EMBEDDING_OFF \
            -Isrc/ui \
            -Isrc/engine \
            -Isrc/engine/eval \
            -Isrc/bridges \
            -I. \
            -Ithird_party/chesslib \
            -Ithird_party/stockfish/sfdev/src \
            -Ithird_party/stockfish/probe \
            -Ithird_party \
            --embed-file $NNUE_FILE \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_ES6=1 \
            -s ENVIRONMENT=web,worker,node \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s INITIAL_MEMORY=268435456 \
            -s STACK_SIZE=1048576 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -s EXPORTED_FUNCTIONS='["_main","_fafnir_init","_fafnir_set_fen","_fafnir_go_movetime","_fafnir_stop","_fafnir_eval"]' \
            -o dist/Fafnir.js

      - name: Subir artefacto compilado (.js y .wasm)
        uses: actions/upload-artifact@v4
        with:
          name: Fafnir-WASM-Build
          path: dist/
